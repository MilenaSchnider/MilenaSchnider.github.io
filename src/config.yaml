site:
  name: Milena Schnider
  site: 'https://milenaschnider.ch' #astrowind.vercel.app
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: uOMv-STRT1HVbGXSW6xLMChsrC5Sq-I

# Default SEO metadata
metadata:
  title:
    default: Milena Schnider
    template: '%s — Milena Schnider'
  description: "\U0001F680 Hi, Ich bin Milena Schnider und eine leidenschaftliche Badmintonspielerin aus der Schweiz. Willkommen auf meiner offiziellen Website!"
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Milena Schnider'
    images:
      - url: '~/assets/images/actionphoto-swissopen-2026.JPEG'
        width: 1200
        height: 628
    type: website
  twitter:
    #handle: '@arthelokyo'
    #site: '@arthelokyo'
    cardType: summary_large_image

i18n:
  language: de-CH
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
